<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Diccionario</title>
  <meta name="description" content="Mini diccionario online multi-idioma que consulta Wiktionary en tiempo real.">

  <!-- BOOTSTRAP -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="d-flex align-items-center justify-content-center flex-column">
    <div class="form-container">

      <main>

        <h1 class="text-center mb-1">📜 Mini Diccionario</h1>
        <p class="subtitulo">Definiciones reales, en el idioma que elijas</p>
        <hr>

        <div class="mb-3">
          <label for="idioma" class="form-label">Idioma</label>
          <select id="idioma" class="form-select">
            <option value="es">Español</option>
            <option value="en">Inglés</option>
            <option value="ca">Catalán</option>
            <option value="fr">Francés</option>
            <option value="zh">Chino</option>
            <option value="de">Alemán</option>
            <option value="ru">Ruso</option>
          </select>
        </div>

        <div class="mb-3 d-flex gap-2">
          <input type="text" id="palabra" class="form-control" placeholder="Ingresa una palabra...">
          <button id="buscar-btn" class="btn btn-dark">Buscar</button>
        </div>

        <div class="mb-2">
          <textarea class="form-control" id="definicion" rows="10" placeholder="La definición aparecerá aquí..." readonly></textarea>
        </div>

        <p class="fuente mb-0">Definiciones obtenidas de Wiktionary (Wikimedia)</p>

        <div class="firma">
          Proyecto by Fede Trucco · <a href="https://github.com/truquinio" target="_blank" rel="noopener">@truquinio</a>
        </div>

      </main>
    </div>
  </div>
  <!-- SCRIPTS -->
  <!-- jQuery / Ajax -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- script de funciones -->
  <script src="./js/funciones.js?v=0.4"></script>
</body>

</html>
